<link rel="stylesheet" href="css/show.css">
</head>

<body>
	<!-- Header / Navbar -->
		<header class="navbar">
			<a href="home.html" class="logo-link">
				<div class="logo-container">
					<div class="logo-circle">
						<img src="/images/logo.png" alt="DNA Logo" class="logo-image">
					</div>
					<span class="brand-name">DNA</span>
				</div>
			</a>


			<nav class="nav-links">
				<a href="/adminhome.html">Home</a>
				<a href="/admin/usuarios/index.html">Usuarios</a>

				<a href="/admin/resenyas/index.html">Reseñas</a>


		    </nav>

			

			<div class="icons">
			    <div class="person-menu-wrapper">
			        <span id="person-icon" class="material-symbols-outlined" style="cursor: pointer;">person</span>

			        <div class="person-menu">
			            <a href="#" id="logoutBtn">Cerrar sesión</a>
			        </div>
			    </div>
			</div>
		</header>
<!-- CONTENIDO -->
<div class="admin-wrapper">
  <div class="product-card">

    <div class="product-title" id="titulo">Reseña</div>

    <div class="product-grid">

      <div class="product-item">
        <div class="label">ID Reseña</div>
        <div class="value" id="id_resenya"></div>
      </div>

      <div class="product-item">
        <div class="label">Producto</div>
        <div class="value" id="producto"></div>
      </div>

      <div class="product-item">
        <div class="label">Cliente</div>
        <div class="value" id="usuario"></div>
      </div>

      <div class="product-item">
        <div class="label">Email</div>
        <div class="value" id="email"></div>
      </div>

      <div class="product-item">
        <div class="label">Puntuación</div>
        <div class="value" id="puntuacion"></div>
      </div>

      <div class="product-item">
        <div class="label">Fecha</div>
        <div class="value" id="fecha"></div>
      </div>

    </div>

    <div class="descripcion">
      <div class="label">Comentario</div>
      <div class="value" id="comentario"></div>
    </div>

    <!-- GALERÍA (si la añades por JS) -->
    <div id="galeria" class="imagenes"></div>

    <!-- BOTÓN AL FINAL (CORRECTO) -->
    <div class="actions">
      <a href="index.html" class="btn btn-volver">← Volver</a>
    </div>

  </div> <!-- product-card -->
</div> <!-- admin-wrapper -->

<!-- MODAL FUERA DEL CONTAINER (CORRECTO) -->
<div id="modal" class="modal">
    <span id="cerrar-modal" class="cerrar-modal">&times;</span>
    <img id="modal-img" class="modal-img">
</div>
