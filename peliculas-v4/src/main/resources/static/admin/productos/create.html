<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Admin – Nuevo Producto</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

<style>
	/* --- RESET --- */
	*, *::before, *::after {
	  box-sizing: border-box;
	  margin: 0;
	  padding: 0;
	}

	/* --- BODY --- */
	body {
	  font-family: 'Lato', sans-serif;
	  background: #fdfbf6;
	  color: #222;
	  min-height: 100vh;
	  padding-top: 64px;
	}

	/* --- NAVBAR --- */
	.navbar {
	  display: flex;
	  align-items: center;
	  justify-content: space-between;
	  padding: 0 40px;
	  height: 64px;
	  background: linear-gradient(90deg, #1a1a1a, #2c2c2c);
	  position: fixed;
	  top: 0;
	  left: 0;
	  right: 0;
	  z-index: 100;
	  box-shadow: 0 4px 8px rgba(0,0,0,0.15);
	}

	/* --- LOGO --- */
	.logo-link {
	  display: flex;
	  align-items: center;
	  text-decoration: none;
	}

	.logo-container {
	  display: flex;
	  align-items: center;
	  gap: 10px;
	}

	.logo-circle {
	  width: 40px;
	  height: 40px;
	  border-radius: 50%;
	  overflow: hidden;
	}

	.logo-image {
	  width: 100%;
	  height: 100%;
	  object-fit: contain;
	}

	.brand-name {
	  color: #fff;
	  font-size: 1.4rem;
	  font-weight: 700;
	  letter-spacing: 1px;
	}

	/* --- NAV LINKS --- */
	.nav-links {
	  display: flex;
	  gap: 28px;
	  position: absolute;
	  left: 50%;
	  transform: translateX(-50%);
	}

	.nav-links a {
	  color: #ddd;
	  text-decoration: none;
	  font-size: 0.9rem;
	  letter-spacing: 1px;
	  text-transform: uppercase;
	}

	.nav-links a:hover {
	  color: #1abc9c;
	  transform: translateY(-2px);
	}

	/* --- ICONOS --- */
	.icons {
	  display: flex;
	  align-items: center;
	  gap: 18px;
	}

	.material-symbols-outlined {
	  font-size: 26px;
	  color: #fff;
	  cursor: pointer;
	  transition: 0.2s;
	}

	#person-icon:hover {
	  color: #1abc9c;
	  transform: scale(1.1);
	}

	/* --- DROPDOWN --- */
	.person-menu-wrapper {
	  position: relative;
	}

	.person-menu {
	  display: none;
	  position: absolute;
	  right: 0;
	  top: 100%;
	  background: #fff;
	  border-radius: 8px;
	  min-width: 160px;
	  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
	}

	.person-menu-wrapper:hover .person-menu {
	  display: block;
	}

	.person-menu a {
	  display: block;
	  padding: 10px 12px;
	  color: #333;
	  text-decoration: none;
	}

	.person-menu a:hover {
	  background: #f2f2f2;
	}
  /* --- Formulario --- */
  .admin-wrapper {
    max-width: 680px;
    margin: 48px auto;
    padding: 0 24px;
  }

  .admin-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
  }

  .admin-header h1 {
    font-family: 'Lato', sans-serif;
    font-size: 2rem;
    font-weight: 700;
    color: #333;
  }

  .form-card {
    background: #fff;
    border-radius: 12px;
    padding: 36px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  }

  .form-group {
    margin-bottom: 20px;
  }

  .form-group label {
    display: block;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: #555;
    margin-bottom: 6px;
  }

  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    padding: 10px 14px;
    font-family: 'Lato', sans-serif;
    font-size: 0.95rem;
    border: 1.5px solid #e0ddd8;
    border-radius: 6px;
    background: #fdfbf6;
    color: #222;
    transition: border-color 0.2s;
    outline: none;
  }

  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    border-color: #1abc9c;
  }

  .form-group textarea { resize: vertical; min-height: 100px; }

  .form-actions {
    display: flex;
    gap: 12px;
    margin-top: 28px;
  }

  .btn-guardar {
    padding: 10px 28px;
    background: #1abc9c;
    color: #fff;
    font-family: 'Lato', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(26,188,156,0.3);
    transition: all 0.3s ease;
  }

  .btn-guardar:hover { background: #16a085; transform: translateY(-2px); }

  .btn-cancelar {
    padding: 10px 28px;
    background: #f0ede8;
    color: #555;
    font-family: 'Lato', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    transition: all 0.3s ease;
  }

  .btn-cancelar:hover { background: #e0ddd8; transform: translateY(-2px); }
  
  .error {
      color: #e53935;        /* rojo fuerte */
      font-size: 12px;
      margin-top: 4px;
      display: block;        /* importante para que ocupe línea */
      line-height: 1.2;
  }
</style>
</head>
<body>

	<!-- Header / Navbar -->
		<header class="navbar">
			<a href="home.html" class="logo-link">
				<div class="logo-container">
					<div class="logo-circle">
						<img src="/images/logo.png" alt="DNA Logo" class="logo-image">
					</div>
					<span class="brand-name">DNA</span>
				</div>
			</a>


			<nav class="nav-links">
				<a href="/adminhome.html">Home</a>
				<a href="/admin/usuarios/index.html">Usuarios</a>
				<a href="/admin/productos/index.html">Productos</a>
				<a href="pedidoAdmin.html">Pedidos</a>
				<a href="/admin/categorias/index.html">Categorías</a>
				<a href="/admin/resenyas/index.html">Reseñas</a>


		    </nav>

			

			<div class="icons">
			    <div class="person-menu-wrapper">
			        <span id="person-icon" class="material-symbols-outlined" style="cursor: pointer;">person</span>

			        <div class="person-menu">
			            <a href="#" id="logoutBtn">Cerrar sesión</a>
			        </div>
			    </div>
			</div>
		</header>

<div class="admin-wrapper">
  <div class="admin-header">
    <h1>Nuevo producto</h1>
    <a href="index.html" class="btn-cancelar">← Volver</a>
  </div>

  <div class="form-card">
    <form id="form-create" novalidate>

      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input id="nombre" type="text" required minlength="2" maxlength="50">
		<small class="error" id="error-nombre"></small>

      </div>

      <div class="form-group">
        <label for="color">Color</label>
        <select id="color" required>
			<option value="">-- Selecciona un color --</option>
			  <option value="Rojo">Rojo</option>
			  <option value="Azul">Azul</option>
			  <option value="Verde">Verde</option>
			  <option value="Negro">Negro</option>
			  <option value="Blanco">Blanco</option>
			  <option value="Beige">Beige</option>
			  <option value="Gris">Gris</option>
			  <option value="Amarillo">Amarillo</option>
			  <option value="Rosa">Rosa</option>
			  <option value="Morado">Morado</option>
		</select>	  
		<small class="error" id="error-color"></small>

      </div>

      <div class="form-group">
        <label for="precio">Precio (€)</label>
        <input id="precio" type="number" step="0.01" min="0" required>
		<small class="error" id="error-precio"></small>
      </div>

      <div class="form-group">
        <label for="stock">Stock</label>
        <input id="stock" type="number" min="0" step="1" required>
		<small class="error" id="error-stock"></small>
      </div>

      <div class="form-group">
        <label for="categoria">Categoría</label>
        <select id="categoria">
          <option value="">-- Sin categoría --</option>
        </select>
      </div>

      <div class="form-group">
        <label for="descripcion">Descripción</label>
        <textarea id="descripcion"></textarea>
		<small class="error" id="error-descripcion"></small>
      </div>
      
       <div class="form-group">
        <label for="estado">Estado</label>
        <select id="estado">
          <option value="activo">Activo</option>
          <option value="inactivo">Inactivo</option>
          
        </select>
      </div>
	  <div class="form-group">
	    <label for="imagen">Imagen</label>
	    <input id="imagen" type="file" accept="image/*">
	  </div>

	  <div class="form-group">
	    <img id="preview" style="display:none; max-width:200px; margin-top:10px; border-radius:8px;">
	  </div>

	  
      <div class="form-actions">
        <button type="submit" class="btn-guardar">Guardar</button>
        <a href="index.html" class="btn-cancelar">Cancelar</a>
      </div>

    </form>
  </div>
</div>

<script type="module" src="js/create.js"></script>
</body>
</html>
