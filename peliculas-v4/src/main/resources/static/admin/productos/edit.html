<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Editar Producto</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

<style>
	/* --- RESET --- */
	*,
	*::before,
	*::after {
	  box-sizing: border-box;
	  margin: 0;
	  padding: 0;
	}

	/* --- BODY --- */
	body {
	  font-family: 'Lato', sans-serif;
	  background: #fdfbf6;
	  color: #222;
	  min-height: 100vh;
	  margin: 0;          /* importante eliminar margen por defecto */
	}

	.topbar {
	  display: flex;
	  align-items: center;
	  justify-content: space-between;
	  padding: 0 40px;
	  height: 64px;
	  background: linear-gradient(90deg, #1a1a1a, #2c2c2c);
	  position: fixed;       /* fijamos completamente arriba */
	  top: 0;
	  left: 0;
	  right: 0;
	  z-index: 100;
	  box-shadow: 0 4px 8px rgba(0,0,0,0.15);
	}

	body .edit-container {
	  margin-top: 80px; /* deja espacio suficiente para header fijo */
	}

	.topbar .logo {
	  display: flex;
	  align-items: center;
	  gap: 12px;
	  color: #fff;
	  font-family: 'Playfair Display', serif;
	  font-size: 1.6rem;
	  font-weight: 700;
	  letter-spacing: 2px;
	  text-decoration: none;
	}

	.topbar .logo img {
	  height: 40px;
	  object-fit: contain;
	}

	.menu {
	  display: flex;
	  gap: 28px;
	}

	.menu a {
	  color: #ddd;
	  text-decoration: none;
	  font-size: 0.9rem;
	  letter-spacing: 1px;
	  text-transform: uppercase;
	  transition: all 0.3s ease;
	}

	.menu a:hover {
	  color: #1abc9c;
	  transform: translateY(-2px);
	}

	.icons {
	  display: flex;
	  align-items: center;
	  gap: 18px;
	  color: #fff;
	  position: relative;
	  cursor: pointer;
	}

	.icons .material-symbols-outlined {
	  font-size: 28px;
	  transition: color 0.3s ease, transform 0.2s ease;
	}

	.icons:hover .material-symbols-outlined {
	  color: #1abc9c;
	  transform: scale(1.2);
	}

	/* --- PERSON MENU --- */
	.person-menu-wrapper { position: relative; }

	.person-menu {
	  display: none;
	  position: absolute;
	  right: 0;
	  top: 44px;
	  background: #fff;
	  border-radius: 8px;
	  min-width: 160px;
	  box-shadow: 0 6px 20px rgba(0,0,0,0.15);
	  overflow: hidden;
	  z-index: 50;
	}

	.person-menu-wrapper:hover .person-menu {
	  display: block;
	}

	.person-menu a {
	  display: block;
	  padding: 12px 18px;
	  font-size: 0.88rem;
	  color: #333;
	  text-decoration: none;
	  transition: background 0.2s;
	}

	.person-menu a:hover {
	  background: #f0f0f0;
	}

/* TOPBAR */
.topbar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 40px;
  height:64px;
  position:fixed;
  top:0;
  left:0;
  right:0;
  background:linear-gradient(90deg,#1a1a1a,#2c2c2c);
  color:white;
}

/* CONTAINER */
.edit-container {
  max-width:700px;
  margin:100px auto 40px;
  background:#fff;
  padding:30px;
  border-radius:12px;
  box-shadow:0 6px 20px rgba(0,0,0,.08);
}
.edit-container h1 {
  margin-bottom: 24px;
}
/* FORM */
.edit-form {
  display:flex;
  flex-direction:column;
  gap:12px;
}

label {
  font-weight:600;
  font-size:14px;
  color: #555;

}


input, select, textarea {
  padding:8px;
  border:1px solid #ccc;
  border-radius:6px;
}

/* BOTONES (CLAVE) */
.buttons {
  display:flex;
  flex-direction:row;
  justify-content:flex-start;
  gap:12px;
  margin-top:10px;
}

.btn-main,
.btn-cancel {
  padding:8px 16px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:700;
  text-transform:uppercase;
}

.btn-main {
  background:#1abc9c;
  color:white;
}

.btn-cancel {
  background:#c0392b;
  color:white;
}

/* IMAGENES */
#galeria {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

#galeria img {
  height:100px;
  border-radius:8px;
  cursor:pointer;
}
#galeria > div {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}

.btn-eliminar {
  background:#c0392b;
  color:white;
  border:none;
  padding:5px 10px;
  border-radius:6px;
  cursor: pointer;
}

/* MODAL */
.modal {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  justify-content:center;
  align-items:center;
}

.modal img {
  max-width:90%;
  max-height:90%;
}

.cerrar-modal {
  position:absolute;
  top:20px;
  right:30px;
  font-size:40px;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>
	
	<header class="topbar">
	  <a href="home.html" class="logo">
	    <img src="/images/logo.png" alt="Logo">
	    DNA
	  </a>

	  <nav class="menu">
	    <a href="../../adminhome.html">Home</a>
	    <a href="index.html">Usuarios</a>
	    <a href="../productos/index.html">Productos</a>
	    <a href="../pedidos/index.html">Pedidos</a>
	  </nav>

	  <div class="icons person-menu-wrapper">
	    <span class="material-symbols-outlined">account_circle</span>
	    <div class="person-menu">
	      <a href="#">Perfil</a>
	      <a href="#" id="logoutBtn">Salir</a>
	    </div>
	  </div>
	</header>

	
	<main class="edit-container">
	
	  <h1>Editar Producto</h1>
	
	  <form id="form-producto" class="edit-form">
	
	    <label>Nombre</label>
	    <input id="nombre" name="nombre">
	
	    <label>Color</label>
	    <input id="color" name="color">
	
	    <label>Precio</label>
	    <input id="precio" name="precio">
	
	    <label>Stock</label>
	    <input id="stock" name="stock">
	
	    <label>Categoría</label>
	    <select id="categoria"></select>
	
	    <label>Descripción</label>
	    <textarea id="descripcion"></textarea>
	
	    <label>Estado</label>
	    <select id="estado">
	      <option value="activo">Activo</option>
	      <option value="inactivo">Inactivo</option>
	    </select>
	
	    <label>Imágenes</label>
	    <input type="file" id="imagen">
	
	    <div id="galeria"></div>
	
	    <div class="buttons">
	      <button type="submit" class="btn-main">Actualizar</button>
	      <button type="button" class="btn-cancel" onclick="window.location.href='index.html'">
	        Cancelar
	      </button>
	    </div>
	
	  </form>
	
  	</main>
	
	<div id="modal" class="modal">
	  <span id="cerrar-modal" class="cerrar-modal">&times;</span>
	  <img id="modal-img">
	</div>
	
	<script type="module" src="js/edit.js"></script>

</body>
</html>
