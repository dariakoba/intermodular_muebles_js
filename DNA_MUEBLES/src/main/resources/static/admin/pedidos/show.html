<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Admin – Ver Pedido</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
<link rel="stylesheet" href="css/show.css">
</head>
<body>

    <header class="navbar">
        <a href="/adminhome.html" class="logo-link">
            <div class="logo-container">
                <div class="logo-circle"><img src="/images/logo.png" alt="DNA" class="logo-image"></div>
                <span class="brand-name">DNA</span>
            </div>
        </a>
        <nav class="nav-links">
            <a href="/adminhome.html">Home</a>
            <a href="/admin/usuarios/index.html">Usuarios</a>
            <a href="/admin/productos/index.html">Productos</a>
            <a href="index.html">Pedidos</a>
            <a href="/admin/categorias/index.html">Categorías</a>
            <a href="/admin/resenyas/index.html">Reseñas</a>
        </nav>
        <div class="icons">
            <div class="person-menu-wrapper">
                <span id="person-icon" class="material-symbols-outlined">person</span>
                <div class="person-menu"><a href="#" id="logoutBtn">Cerrar sesión</a></div>
            </div>
        </div>
    </header>

<div class="admin-wrapper">
  <div class="product-card">
    <div class="product-title" id="titulo-pedido">Pedido #---</div>
    
    <div class="product-grid">
      <div class="product-item"><div class="label">Cliente</div><div class="value" id="cliente"></div></div>
      <div class="product-item"><div class="label">Fecha</div><div class="value" id="fecha"></div></div>
      <div class="product-item"><div class="label">Email</div><div class="value" id="email"></div></div>
      <div class="product-item"><div class="label">Teléfono</div><div class="value" id="telefono"></div></div>
      <div class="product-item" style="grid-column: span 2;"><div class="label">Dirección de envío</div><div class="value" id="direccion"></div></div>
      <div class="product-item"><div class="label">Estado</div><div class="value" id="estado" style="color:#c0392b;"></div></div>
      <div class="product-item"><div class="label">Método de Pago</div><div class="value" id="metodo"></div></div>
    </div>
    
    <div class="descripcion" style="background: #f9f9f9; padding: 15px; border-radius: 8px; border: 1px dashed #ccc;">
      <div class="label">Productos Comprados</div>
      <div class="value" id="productos-lista"></div>
    </div>
    
    <div style="text-align: right; margin-top: 20px; font-size: 1.5rem;">
        <strong>TOTAL: <span id="total" style="color: #1abc9c;"></span></strong>
    </div>

    <div class="actions">
      <a href="index.html" class="btn btn-volver">Volver</a>
    </div>

  </div>
</div>

<script type="module" src="js/show.js"></script>
<script src="/js/logout.js"></script>
</body>
</html>
