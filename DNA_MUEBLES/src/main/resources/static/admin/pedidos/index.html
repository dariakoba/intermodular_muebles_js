<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Admin – Pedidos</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap">

<link rel="stylesheet" href="css/index.css">
</head>
<body>

    <header class="navbar">
        <a href="/adminhome.html" class="logo-link">
            <div class="logo-container">
                <div class="logo-circle"><img src="/images/logo.png" alt="DNA" class="logo-image"></div>
                <span class="brand-name">DNA</span>
            </div>
        </a>
        <nav class="nav-links">
            <a href="/adminhome.html">Home</a>
            <a href="/admin/usuarios/index.html">Usuarios</a>
            <a href="/admin/productos/index.html">Productos</a>
            <a href="index.html">Pedidos</a>
            <a href="/admin/categorias/index.html">Categorías</a>
            <a href="/admin/resenyas/index.html">Reseñas</a>
        </nav>
        <div class="icons">
            <div class="person-menu-wrapper">
                <span id="person-icon" class="material-symbols-outlined">person</span>
                <div class="person-menu"><a href="#" id="logoutBtn">Cerrar sesión</a></div>
            </div>
        </div>
    </header>

    <main class="admin-wrapper">
      <div class="admin-header">
        <h1>Gestión de Pedidos</h1>
		<div class="admin-actions">
		          <select id="filtro-estado" style="padding: 9px; border: 1px solid #ccc; border-radius: 6px; font-family: Lato; background: #fff; cursor: pointer; outline: none;">
		            <option value="">Todos los estados</option>
		            <option value="Pendiente de pago">Pendiente de pago</option>
		            <option value="Pagado">Pagado</option>
		            <option value="En proceso">En proceso</option>
		            <option value="Enviando">Enviando</option>
		            <option value="Recibido">Recibido</option>
		            <option value="Devuelto">Devuelto</option>
		            <option value="Cancelado">Cancelado</option>
		          </select>

		          <input type="date" id="filtro-fecha" style="padding: 9px; border: 1px solid #ccc; border-radius: 6px; font-family: Lato; outline: none;">
		          
		          <button id="btn-eliminar-seleccionados">Eliminar seleccionados</button>
		          
		          <button class="btn-nuevo" id="btn-actualizar" style="font-family: 'Lato', sans-serif;">
		            <i class="fa-solid fa-rotate"></i> Actualizar
		          </button>
		        </div>
      </div>
    
      <div class="tabla-wrapper">
        <table id="tabla-pedidos">
          <thead>
            <tr>
              <th><input type="checkbox" id="check-all"></th>
              <th>ID</th>
              <th>Fecha</th>
              <th>Cliente</th>
              <th>Total</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            </tbody>
        </table>
      </div>
    </main>

    <div id="modalBorrar" class="modal-overlay">
        <div class="modal-box" style="border-top: 5px solid #e74c3c; max-width: 400px; text-align: center;">
            <h2 style="color: #e74c3c; margin-bottom: 10px;"><i class="fa-solid fa-triangle-exclamation"></i> Atención</h2>
            <p>Vas a eliminar permanentemente <strong style="font-size: 1.2rem;"><span id="modal-borrar-count"></span> pedido(s)</strong>.</p>
            <p style="font-size: 13px; color: #7f8c8d; margin-top: 5px;">Esta acción no se puede deshacer.</p>
            
            <input type="text" id="input-borrar" placeholder="Escribe BORRAR" style="text-align: center; text-transform: uppercase; font-weight: bold; margin-top: 20px;">
            <p id="error-borrar" style="color: #e74c3c; font-size: 12px; display: none; margin-bottom: 10px;">Debes escribir la palabra exacta.</p>
            
            <div style="display: flex; justify-content: center; gap: 15px; margin-top: 20px;">
                <button id="btn-cancelar-borrar" style="padding: 10px 18px; background: #95a5a6; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Cancelar</button>
                <button id="btn-confirmar-borrar" style="padding: 10px 18px; background: #c0392b; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Eliminar</button>
            </div>
        </div>
    </div>

<script type="module" src="js/index.js"></script>
<script src="/js/logout.js"></script>
</body>
</html>
