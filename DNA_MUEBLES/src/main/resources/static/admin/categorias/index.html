<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Admin – Categorías</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<link rel="stylesheet" href="/admin/categorias/css/index.css">


</head>

<body>

	<!-- Header / Navbar -->
	<header class="navbar">
		<a href="/adminhome.html" class="logo-link">
			<div class="logo-container">
				<div class="logo-circle">
					<img src="/images/logo.png" alt="DNA Logo" class="logo-image">
				</div>
				<span class="brand-name">DNA</span>
			</div>
		</a>


		<nav class="nav-links">
			<a href="/adminhome.html">Home</a>
			<a href="/admin/usuarios/index.html">Usuarios</a>
			<a href="/admin/productos/index.html">Productos</a>
			<a href="/admin/pedidos/index.html">Pedidos</a>
			<a href="/admin/categorias/index.html">Categorías</a>
			<a href="/admin/resenyas/index.html">Reseñas</a>


	    </nav>

		

		<div class="icons">
		    <div class="person-menu-wrapper">
		        <span id="person-icon" class="material-symbols-outlined" style="cursor: pointer;">person</span>

		        <div class="person-menu">
		            <a href="#" id="logoutBtn">Cerrar sesión</a>
		        </div>
		    </div>
		</div>
	</header>

<main class="admin-wrapper">
  <div class="admin-header">
    <h1>Categorías</h1>
	<div class="admin-filters">
		    <div class="search-box">
		        <span class="material-symbols-outlined">search</span>
		        <input type="text" id="inputBuscar" placeholder="Buscar nombre o email...">
		    </div>
		    
		    <div class="select-filters">
		        <select id="filterEstado">
		            <option value="">Estados</option>
		            <option value="activo">Activo</option>
		            <option value="inactivo">Inactivo</option>
		        </select>
		    </div>
	</div>
    <div class="admin-actions">
      <button id="btn-eliminar-seleccionados">Eliminar seleccionados</button>
      <a href="/admin/categorias/create.html" class="btn-nuevo">Nueva Categoria</a>
    </div>
  </div>

  <div class="tabla-wrapper">
    <table id="tabla-productos">
      <thead>
        <tr>
          <th><input type="checkbox" id="check-all"></th>
          <th>ID</th>
          <th>Nombre</th>
       	  <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>
  </div>
</main>

<script type="module" src="js/index.js"></script>
<script src="/js/logout.js"></script>
</body>
</html>
