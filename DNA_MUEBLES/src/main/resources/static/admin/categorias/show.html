<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Admin – Ver Producto</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

<style>
	/* --- RESET --- */
	*, *::before, *::after {
	  box-sizing: border-box;
	  margin: 0;
	  padding: 0;
	}

	/* --- BODY --- */
	body {
	  font-family: 'Lato', sans-serif;
	  background: #fdfbf6;
	  color: #222;
	  min-height: 100vh;
	  padding-top: 64px;
	}

	/* --- NAVBAR --- */
	.navbar {
	  display: flex;
	  align-items: center;
	  justify-content: space-between;
	  padding: 0 40px;
	  height: 64px;
	  background: linear-gradient(90deg, #1a1a1a, #2c2c2c);
	  position: fixed;
	  top: 0;
	  left: 0;
	  right: 0;
	  z-index: 100;
	  box-shadow: 0 4px 8px rgba(0,0,0,0.15);
	}

	/* --- LOGO --- */
	.logo-link {
	  display: flex;
	  align-items: center;
	  text-decoration: none;
	}

	.logo-container {
	  display: flex;
	  align-items: center;
	  gap: 10px;
	}

	.logo-circle {
	  width: 40px;
	  height: 40px;
	  border-radius: 50%;
	  overflow: hidden;
	}

	.logo-image {
	  width: 100%;
	  height: 100%;
	  object-fit: contain;
	}

	.brand-name {
	  color: #fff;
	  font-size: 1.4rem;
	  font-weight: 700;
	  letter-spacing: 1px;
	}

	/* --- NAV LINKS --- */
	.nav-links {
	  display: flex;
	  gap: 28px;
	  position: absolute;
	  left: 50%;
	  transform: translateX(-50%);
	}

	.nav-links a {
	  color: #ddd;
	  text-decoration: none;
	  font-size: 0.9rem;
	  letter-spacing: 1px;
	  text-transform: uppercase;
	}

	.nav-links a:hover {
	  color: #1abc9c;
	  transform: translateY(-2px);
	}

	/* --- ICONOS --- */
	.icons {
	  display: flex;
	  align-items: center;
	  gap: 18px;
	}

	.material-symbols-outlined {
	  font-size: 26px;
	  color: #fff;
	  cursor: pointer;
	  transition: 0.2s;
	}

	#person-icon:hover {
	  color: #1abc9c;
	  transform: scale(1.1);
	}

	/* --- DROPDOWN --- */
	.person-menu-wrapper {
	  position: relative;
	}

	.person-menu {
	  display: none;
	  position: absolute;
	  right: 0;
	  top: 100%;
	  background: #fff;
	  border-radius: 8px;
	  min-width: 160px;
	  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
	}

	.person-menu-wrapper:hover .person-menu {
	  display: block;
	}

	.person-menu a {
	  display: block;
	  padding: 10px 12px;
	  color: #333;
	  text-decoration: none;
	}

	.person-menu a:hover {
	  background: #f2f2f2;
	}

/* --- CONTENIDO --- */
.admin-wrapper {
  max-width: 900px;
  margin: 60px auto;
  padding: 0 24px;
}

/* CARD */
.product-card {
  background: #fff;
  border-radius: 14px;
  padding: 32px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.08);
  transition: transform 0.2s;
}

.product-card:hover {
  transform: translateY(-3px);
}

.product-title {
  font-size: 2rem;
  font-weight: 700;
  margin-bottom: 24px;
  color: #333;
}

/* GRID INFO */
.product-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.product-item {
  display: flex;
  flex-direction: column;
}

.label {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #888;
  margin-bottom: 4px;
}

.value {
  font-size: 1rem;
  font-weight: 600;
  color: #222;
}

/* DESCRIPCIÓN */
.descripcion {
  margin-top: 24px;
}

.descripcion .value {
  font-weight: 400;
  line-height: 1.5;
}

/* BOTONES */
.actions {
  margin-top: 30px;
  display: flex;
  gap: 12px;
}

.btn {
  padding: 10px 18px;
  font-size: 0.85rem;
  font-weight: 700;
  text-transform: uppercase;
  border-radius: 6px;
  cursor: pointer;
  border: none;
  text-decoration: none;
  transition: 0.25s;
}

.btn-editar {
  background: #fef3e2;
  color: #c07a00;
}

.btn-volver {
  background: #e8f4f5;
  color: #2a9aa6;
}

.btn:hover {
  opacity: 0.85;
  transform: translateY(-1px);
}

/* RESPONSIVE */
@media (max-width: 768px) {
  .product-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

	<!-- Header / Navbar -->
	<header class="navbar">
		<a href="/adminhome.html" class="logo-link">
			<div class="logo-container">
				<div class="logo-circle">
					<img src="/images/logo.png" alt="DNA Logo" class="logo-image">
				</div>
				<span class="brand-name">DNA</span>
			</div>
		</a>


		<nav class="nav-links">
			<a href="/adminhome.html">Home</a>
			<a href="/admin/usuarios/index.html">Usuarios</a>
			<a href="/admin/productos/index.html">Productos</a>
			<a href="pedidoAdmin.html">Pedidos</a>
			<a href="/admin/categorias/index.html">Categorías</a>
			<a href="/admin/resenyas/index.html">Reseñas</a>


	    </nav>

		

		<div class="icons">
		    <div class="person-menu-wrapper">
		        <span id="person-icon" class="material-symbols-outlined" style="cursor: pointer;">person</span>

		        <div class="person-menu">
		            <a href="#" id="logoutBtn">Cerrar sesión</a>
		        </div>
		    </div>
		</div>
	</header>

<!-- CONTENIDO -->
<div class="admin-wrapper">
  <div class="product-card">

    <div class="product-title" id="nombre">Categoria</div>

    <div class="product-grid">
      <div class="product-item">
        <div class="label">ID</div>
        <div class="value" id="id"></div>
      </div>

      <div class="product-item">
        <div class="label">Nombre</div>
        <div class="value" id="categoria"></div>
      </div>

      <div class="product-item">
        <div class="label">Estado</div>
        <div class="value" id="estado"></div>
      </div>

     

    <div class="actions">
      <a id="btn-editar" class="btn btn-editar">Editar</a>
      <a href="/admin/categorias/index.html" class="btn btn-volver">Volver</a>
    </div>

  </div>
</div>
<script type="module" src="js/show.js"></script>
<script>
	document.addEventListener("DOMContentLoaded", () => {
	    const icon = document.getElementById("person-icon");
	    const menu = document.querySelector(".person-menu");
	    const logoutBtn = document.getElementById("logoutBtn");

	    if (icon && menu) {
	        icon.addEventListener("click", (e) => {
	            e.stopPropagation();
	            menu.classList.toggle("show");
	        });

	        document.addEventListener("click", () => {
	            menu.classList.remove("show");
	        });
	    }

	    if (logoutBtn) {
	        logoutBtn.addEventListener("click", async (e) => {
	            e.preventDefault();

	            if (!confirm("¿Estás seguro de que quieres cerrar sesión?")) return;

	            try {
	                const res = await fetch("/logout", {   
	                    method: "POST",
	                    credentials: "include"
	                });

	                localStorage.clear();
	                sessionStorage.clear();

	                window.location.href = "/../../login.html";

	            } catch (err) {
	                console.error("Error al cerrar sesión:", err);
	                // En caso de error de red, forzamos la salida al login
	                window.location.href = "/../../login.html";
	            }
	        });
	    }
	});
	

</script>
</body>
</html>
