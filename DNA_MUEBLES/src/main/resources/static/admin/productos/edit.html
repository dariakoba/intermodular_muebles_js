<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Editar Producto</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

<style>
	/* --- RESET --- */
	*, *::before, *::after {
	  box-sizing: border-box;
	  margin: 0;
	  padding: 0;
	}

	/* --- BODY --- */
	body {
	  font-family: 'Lato', sans-serif;
	  background: #fdfbf6;
	  color: #222;
	  min-height: 100vh;
	  padding-top: 64px;
	}

	/* --- NAVBAR --- */
	.navbar {
	  display: flex;
	  align-items: center;
	  justify-content: space-between;
	  padding: 0 40px;
	  height: 64px;
	  background: linear-gradient(90deg, #1a1a1a, #2c2c2c);
	  position: fixed;
	  top: 0;
	  left: 0;
	  right: 0;
	  z-index: 100;
	  box-shadow: 0 4px 8px rgba(0,0,0,0.15);
	}

	/* --- LOGO --- */
	.logo-link {
	  display: flex;
	  align-items: center;
	  text-decoration: none;
	}

	.logo-container {
	  display: flex;
	  align-items: center;
	  gap: 10px;
	}

	.logo-circle {
	  width: 40px;
	  height: 40px;
	  border-radius: 50%;
	  overflow: hidden;
	}

	.logo-image {
	  width: 100%;
	  height: 100%;
	  object-fit: contain;
	}

	.brand-name {
	  color: #fff;
	  font-size: 1.4rem;
	  font-weight: 700;
	  letter-spacing: 1px;
	}

	/* --- NAV LINKS --- */
	.nav-links {
	  display: flex;
	  gap: 28px;
	  position: absolute;
	  left: 50%;
	  transform: translateX(-50%);
	}

	.nav-links a {
	  color: #ddd;
	  text-decoration: none;
	  font-size: 0.9rem;
	  letter-spacing: 1px;
	  text-transform: uppercase;
	}

	.nav-links a:hover {
	  color: #1abc9c;
	  transform: translateY(-2px);
	}

	/* --- ICONOS --- */
	.icons {
	  display: flex;
	  align-items: center;
	  gap: 18px;
	}

	.material-symbols-outlined {
	  font-size: 26px;
	  color: #fff;
	  cursor: pointer;
	  transition: 0.2s;
	}

	#person-icon:hover {
	  color: #1abc9c;
	  transform: scale(1.1);
	}

	/* --- DROPDOWN --- */
	.person-menu-wrapper {
	  position: relative;
	}

	.person-menu {
	  display: none;
	  position: absolute;
	  right: 0;
	  top: 100%;
	  background: #fff;
	  border-radius: 8px;
	  min-width: 160px;
	  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
	}

	.person-menu-wrapper:hover .person-menu {
	  display: block;
	}

	.person-menu a {
	  display: block;
	  padding: 10px 12px;
	  color: #333;
	  text-decoration: none;
	}

	.person-menu a:hover {
	  background: #f2f2f2;
	}


/* CONTAINER */
.edit-container {
  max-width:700px;
  margin:100px auto 40px;
  background:#fff;
  padding:30px;
  border-radius:12px;
  box-shadow:0 6px 20px rgba(0,0,0,.08);
}
.edit-container h1 {
  margin-bottom: 24px;
}
/* FORM */
.edit-form {
  display:flex;
  flex-direction:column;
  gap:12px;
}

label {
  font-weight:600;
  font-size:14px;
  color: #555;

}


input, select, textarea {
  padding:8px;
  border:1px solid #ccc;
  border-radius:6px;
}

/* BOTONES (CLAVE) */
.buttons {
  display:flex;
  flex-direction:row;
  justify-content:flex-start;
  gap:12px;
  margin-top:10px;
}

.btn-main,
.btn-cancel {
  padding:8px 16px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:700;
  text-transform:uppercase;
}

.btn-main {
  background:#1abc9c;
  color:white;
}

.btn-cancel {
  background:#c0392b;
  color:white;
}

/* IMAGENES */
#galeria {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

#galeria img {
  height:100px;
  border-radius:8px;
  cursor:pointer;
}
#galeria > div {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}

.btn-eliminar {
  background:#c0392b;
  color:white;
  border:none;
  padding:5px 10px;
  border-radius:6px;
  cursor: pointer;
}

/* MODAL */
.modal {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  justify-content:center;
  align-items:center;
}

.modal img {
  max-width:90%;
  max-height:90%;
}

.cerrar-modal {
  position:absolute;
  top:20px;
  right:30px;
  font-size:40px;
  color:white;
  cursor:pointer;
}
.error {
    color: #e53935;        /* rojo fuerte */
    font-size: 12px;
    margin-top: 4px;
    display: block;        /* importante para que ocupe línea */
    line-height: 1.2;
}
</style>
</head>

<body>
	
	<!-- Header / Navbar -->
		<header class="navbar">
			<a href="/adminhome.html" class="logo-link">
				<div class="logo-container">
					<div class="logo-circle">
						<img src="/images/logo.png" alt="DNA Logo" class="logo-image">
					</div>
					<span class="brand-name">DNA</span>
				</div>
			</a>


			<nav class="nav-links">
				<a href="/adminhome.html">Home</a>
				<a href="/admin/usuarios/index.html">Usuarios</a>
				<a href="/admin/productos/index.html">Productos</a>
				<a href="pedidoAdmin.html">Pedidos</a>
				<a href="/admin/categorias/index.html">Categorías</a>
				<a href="/admin/resenyas/index.html">Reseñas</a>


		    </nav>

			

			<div class="icons">
			    <div class="person-menu-wrapper">
			        <span id="person-icon" class="material-symbols-outlined" style="cursor: pointer;">person</span>

			        <div class="person-menu">
			            <a href="#" id="logoutBtn">Cerrar sesión</a>
			        </div>
			    </div>
			</div>
		</header>

	
	<main class="edit-container">
	
	  <h1>Editar Producto</h1>
	
	  <form id="form-producto" class="edit-form" novalidate>
	
	    <label>Nombre</label>
	    <input id="nombre" name="nombre">
		<small class="error" id="error-nombre"></small>

	    <label>Color</label>
		<select id="color" required>
					<option value="">-- Selecciona un color --</option>
					  <option value="Rojo">Rojo</option>
					  <option value="Azul">Azul</option>
					  <option value="Verde">Verde</option>
					  <option value="Negro">Negro</option>
					  <option value="Blanco">Blanco</option>
					  <option value="Beige">Beige</option>
					  <option value="Gris">Gris</option>
					  <option value="Amarillo">Amarillo</option>
					  <option value="Rosa">Rosa</option>
					  <option value="Morado">Morado</option>
		</select>	
		<small class="error" id="error-color"></small>

	    <label>Precio</label>
	    <input id="precio" name="precio">
		<small class="error" id="error-precio"></small>

	    <label>Stock</label>
	    <input id="stock" name="stock">
		<small class="error" id="error-stock"></small>

	    <label>Categoría</label>
	    <select id="categoria"></select>
	
	    <label>Descripción</label>
	    <textarea id="descripcion"></textarea>
		<small class="error" id="error-descripcion"></small>

	    <label>Estado</label>
	    <select id="estado">
	      <option value="activo">Activo</option>
	      <option value="inactivo">Inactivo</option>
	    </select>
	
	    <label>Imágenes</label>
	    <input type="file" id="imagen">
	
	    <div id="galeria"></div>
	
	    <div class="buttons">
	      <button type="submit" class="btn-main">Actualizar</button>
	      <button type="button" class="btn-cancel" onclick="window.location.href='index.html'">
	        Cancelar
	      </button>
	    </div>
	
	  </form>
	
  	</main>
	
	<div id="modal" class="modal">
	  <span id="cerrar-modal" class="cerrar-modal">&times;</span>
	  <img id="modal-img">
	</div>
	
	<script type="module" src="js/edit.js"></script>
	<script src="/js/logout.js"></script>
</body>
</html>
