<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle Usuario</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

  <link rel="stylesheet" href="css/show.css">
</head>

<body>
	<!-- Header / Navbar -->
		<header class="navbar">
			<a href="/adminhome.html" class="logo-link">
				<div class="logo-container">
					<div class="logo-circle">
						<img src="/images/logo.png" alt="DNA Logo" class="logo-image">
					</div>
					<span class="brand-name">DNA</span>
				</div>
			</a>


			<nav class="nav-links">
				<a href="/adminhome.html">Home</a>
				<a href="/admin/usuarios/index.html">Usuarios</a>
				<a href="/admin/productos/index.html">Productos</a>
				<a href="/admin/pedidos/index.html">Pedidos</a>
				<a href="/admin/categorias/index.html">Categorías</a>
				<a href="/admin/resenyas/index.html">Reseñas</a>


		    </nav>

			

			<div class="icons">
			    <div class="person-menu-wrapper">
			        <span id="person-icon" class="material-symbols-outlined" style="cursor: pointer;">person</span>

			        <div class="person-menu">
			            <a href="#" id="logoutBtn">Cerrar sesión</a>
			        </div>
			    </div>
			</div>
		</header>
<div class="admin-wrapper">
  <div class="product-card">

    <div class="product-title" id="titulo">Usuario</div>

    <div class="product-grid">

      <div class="product-item">
        <div class="label">Nombre Completo</div>
        <div class="value" id="nombre"></div>
      </div>

      <div class="product-item">
        <div class="label">Email</div>
        <div class="value" id="email"></div>
      </div>

      <div class="product-item">
        <div class="label">Teléfono</div>
        <div class="value" id="telefono"></div>
      </div>

      <div class="product-item">
        <div class="label">Dirección</div>
        <div class="value" id="direccion"></div>
      </div>

      <div class="product-item">
        <div class="label">Rol</div>
        <div class="value" id="rol"></div>
      </div>

      <div class="product-item">
        <div class="label">Estado</div>
        <div class="value" id="estado"></div>
      </div>

      <div class="product-item">
        <div class="label">Fecha alta</div>
        <div class="value" id="fecha_alta"></div>
      </div>

      <div class="product-item" id="extra-box" style="display:none;">
        <div class="label" id="extra-label"></div>
        <div class="value" id="extra-value"></div>
      </div>

    </div>

    <div class="actions">
      <a href="index.html" class="btn btn-volver">← Volver</a>
    </div>

  </div>
</div>

<script src="js/show.js"></script>
<script src="/js/logout.js"></script>
</body>
</html>
