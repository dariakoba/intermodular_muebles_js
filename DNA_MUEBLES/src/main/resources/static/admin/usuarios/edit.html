<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Editar Usuario</title>
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/edit.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>
<body>

	<!-- Header / Navbar -->
			<header class="navbar">
				<a href="/adminhome.html" class="logo-link">
					<div class="logo-container">
						<div class="logo-circle">
							<img src="/images/logo.png" alt="DNA Logo" class="logo-image">
						</div>
						<span class="brand-name">DNA</span>
					</div>
				</a>


				<nav class="nav-links">
					<a href="/adminhome.html">Home</a>
					<a href="/admin/usuarios/index.html">Usuarios</a>
					<a href="/admin/productos/index.html">Productos</a>
					<a href="/admin/pedidos/index.html">Pedidos</a>
					<a href="/admin/categorias/index.html">Categorías</a>
					<a href="/admin/resenyas/index.html">Reseñas</a>


			    </nav>

				

				<div class="icons">
				    <div class="person-menu-wrapper">
				        <span id="person-icon" class="material-symbols-outlined" style="cursor: pointer;">person</span>

				        <div class="person-menu">
				            <a href="#" id="logoutBtn">Cerrar sesión</a>
				        </div>
				    </div>
				</div>
			</header>


<main class="edit-container">

<h1 class="title">Editar Usuario</h1>

<form id="form-usuario" class="edit-form">

  <input type="hidden" id="userId">

  <label>Nombre</label>
  <input id="nombre" required>

  <label>Apellidos</label>
  <input id="apellidos" required>

  <label>Email</label>
  <input id="email" type="email" required>

  <label>Teléfono</label>
  <input id="telefono">

  <label>Dirección</label>
  <input id="direccion">

  <label>Rol</label>
  <select id="rol">
    <option value="cliente">Cliente</option>
    <option value="admin">Admin</option>
  </select>
  
  <label>Estado</label>
  <select id="estado">
    <option value="activo">Activo</option>
    <option value="inactivo">Inactivo</option>
  </select>

  <div id="grupo-puntos">
    <label>Puntos (solo cliente)</label>
    <input id="puntos" type="number">
  </div>

  <div id="grupo-salario">
    <label>Salario (solo admin)</label>
    <input id="salario" type="number">
  </div>

  <label>Contraseña</label>
  <input id="password" type="password" placeholder="Dejar vacío para mantener contraseña">

  <div class="buttons">
    <button type="submit" class="btn-main">Actualizar</button>

    <button type="button" onclick="window.location.href='index.html'" class="btn-cancel">
      Cancelar
    </button>
  </div>

</form>

</main>

<script src="js/edit.js"></script>
<script src="/js/logout.js"></script>
</body>
</html>
