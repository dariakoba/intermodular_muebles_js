<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo de Muebles</title>

<link rel="stylesheet" href="/css/productos.css">

<!-- ICONOS GOOGLE -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>

<body>

	<header class="topbar">

	<div class="logo">
		<img src="images/login/logo.png" alt="logo">
		<span>DNA</span>
	</div>

	<nav class="menu">
		<a href="index.html">Home</a>
		<a href="productos.html">Catálogo</a>
		<a href="contacto.html">Contacto</a>
	</nav>

	<div class="icons">
		<a href="carrito.html" style="text-decoration: none; color: inherit;">
			<span class="material-symbols-outlined">shopping_cart</span>
		</a>

		<div class="person-menu-wrapper">
			<span id="person-icon" class="material-symbols-outlined">person</span>
			<div class="person-menu" id="person-menu"></div>
		</div>
	</div>

	</header>   

<!-- Botón móvil para mostrar filtros (solo visible en pantallas pequeñas) -->
<button id="btn-filtros" class="btn-mostrar-filtros">
    <span class="material-symbols-outlined">tune</span> Mostrar filtros
</button>

<main class="main-content">

    <aside class="sidebar">
        <h2>Filtrar Productos</h2>

        <!-- Categorías dinámicas -->
        <div class="filter-section">
            <div class="filter-header">
                <h3>Categoría</h3>
                <span class="toggle">+</span>
            </div>
            <div class="filter-options" id="filtro-categorias" style="display:none">
                <!-- JS cargará las categorías aquí -->
            </div>
        </div>

        <!-- Colores estáticos -->
        <div class="filter-section">
            <div class="filter-header">
                <h3>Color</h3>
                <span class="toggle">+</span>
            </div>
            <div class="filter-options" id="filtro-colores" style="display:none">
                <label><input type="checkbox" value="Rojo"> Rojo</label>
                <label><input type="checkbox" value="Azul"> Azul</label>
                <label><input type="checkbox" value="Verde"> Verde</label>
                <label><input type="checkbox" value="Negro"> Negro</label>
                <label><input type="checkbox" value="Blanco"> Blanco</label>
                <label><input type="checkbox" value="Beige"> Beige</label>
                <label><input type="checkbox" value="Gris"> Gris</label>
                <label><input type="checkbox" value="Amarillo"> Amarillo</label>
                <label><input type="checkbox" value="Rosa"> Rosa</label>
                <label><input type="checkbox" value="Morado"> Morado</label>
            </div>
        </div>

        <!-- Precio -->
        <div class="filter-section">
            <div class="filter-header">
                <h3>Precio</h3>
                <span class="toggle">+</span>
            </div>
            <div class="filter-options" style="display:none">
                <label>Min: <input id="precio-min" type="number" min="0" placeholder="0"></label>
                <label>Max: <input id="precio-max" type="number" min="0" placeholder="1000"></label>
            </div>
        </div>

        <!-- Ordenar -->
        <div class="filter-section">
            <h3>Ordenar por</h3>
            <select id="ordenar">
                <option value="nombre-asc">Nombre A-Z</option>
                <option value="nombre-desc">Nombre Z-A</option>
                <option value="precio-asc">Precio más bajo</option>
                <option value="precio-desc">Precio más alto</option>
            </select>
        </div>

        <button id="aplicar-filtros">Aplicar filtros</button>
    </aside>

    <!-- Contenido principal -->
    <section class="productos-wrapper">
        <div id="productos-container" class="productos-container">
            <!-- JS añadirá las tarjetas aquí -->
        </div>
    </section>

</main>

<script src="/js/productos.js"></script>
<script src="/js/menuUser.js"></script>

</body>
</html>
